<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PH City Explorer</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="map"></div>

    <!-- Error popup that slides down from the top -->
    <div id="toast" class="toast" role="alert" aria-live="assertive">
      <span id="toast-text"></span>
      <button id="toast-close" type="button" aria-label="Dismiss error">
        ✕
      </button>
    </div>

    <main class="panel">
      <h1>PH City Explorer</h1>
      <form id="search-form">
        <input
          id="query"
          type="text"
          placeholder="Search a city…"
          autocomplete="off"
          aria-label="Search a Philippine city"
        />
        <button id="clear-btn" type="button" aria-label="Clear search" hidden>
          ✕
        </button>
        <button id="search-btn" type="submit" aria-label="Search">→</button>
      </form>
      <p id="message">Try “Cagayan de Oro” or “Cebu”.</p>

      <section id="recent" class="recent" hidden>
        <div class="recent-header">
          <h2>Recent</h2>
          <button id="clear-recent-btn" type="button">Clear all</button>
        </div>
        <ul id="recent-list" class="recent-list"></ul>
      </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
